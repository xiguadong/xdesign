<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title description">
  <title id="title">Aster current-reading request and response</title>
  <desc id="description">Controller sends ReadRequest, Sensor validates it, then returns ReadingResponse. A dashed timeout path returns no reading.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#333"/></marker>
  </defs>
  <rect x="70" y="20" width="140" height="45" rx="4" fill="#fff2cc" stroke="#886600"/>
  <text x="105" y="48" font-size="16">Controller</text>
  <rect x="410" y="20" width="140" height="45" rx="4" fill="#ddeeff" stroke="#225577"/>
  <text x="455" y="48" font-size="16">Sensor</text>
  <path d="M140 65 V295 M480 65 V295" stroke="#888" stroke-dasharray="4 4"/>
  <path d="M140 100 H480" stroke="#333" marker-end="url(#arrow)"/>
  <text x="155" y="90" font-size="14">1. ReadRequest(sensorId)</text>
  <path d="M480 130 C540 130 540 175 480 175" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="495" y="155" font-size="14">2. validate</text>
  <path d="M480 215 H140" stroke="#333" marker-end="url(#arrow)"/>
  <text x="155" y="205" font-size="14">3. ReadingResponse</text>
  <path d="M480 265 H140" stroke="#886600" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="155" y="255" font-size="14" fill="#886600">4. TIMEOUT — no reading</text>
  <text x="165" y="305" font-size="12" fill="#555">Validation precedes buffer access; timeout has no value response.</text>
</svg>
