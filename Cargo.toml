[package]
name = "xdesign"
version = "0.1.0"
edition = "2021"
# The operator web UI source and assets live under `web/`. The build script
# embeds `web/assets/` so the released executable stays self-contained and the
# web program ships with the product without a Node.js or static-server runtime.
build = "web/server/build.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
libc = "=0.2.190"
