<svg xmlns="http://www.w3.org/2000/svg" width="1337" height="1057" viewBox="0 0 1337 1057" font-family="Arial, Helvetica, sans-serif" font-size="12">
<style>
.box { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.rule, .edge { stroke: #000000; stroke-width: 1; fill: none; }
.arrow { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.diamond { fill: #000000; stroke: #000000; stroke-width: 1; }
.hollow { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.tip { fill: none; stroke: #000000; stroke-width: 1; }
.initial { fill: #000000; }
.port { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.guide { stroke: #000000; stroke-width: 1; opacity: 0.4; }
.dependency { stroke: #000000; stroke-width: 1; fill: none; stroke-dasharray: 6 4; }
.succession { stroke: #000000; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
.lifeline { stroke: #000000; stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
.lane { fill: none; stroke: #000000; stroke-width: 1; }
.name { fill: #000000; font-weight: bold; }
.abstract { font-style: italic; }
.keyword, .feature { fill: #000000; }
.aside { fill: #000000; paint-order: stroke; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
.compartment { fill: #000000; font-style: italic; }
@media (prefers-color-scheme: dark) {
.box, .arrow, .hollow, .port { fill: #1e1e1e; stroke: #d4d4d4; }
.rule, .edge, .tip, .guide, .dependency, .succession, .lifeline, .lane { stroke: #d4d4d4; }
.diamond { fill: #d4d4d4; stroke: #d4d4d4; }
.initial, .name, .keyword, .feature, .compartment { fill: #d4d4d4; }
.aside { fill: #d4d4d4; stroke: #1e1e1e; }
}
</style>
<defs><marker id="specialization" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path class="arrow" d="M0,0 L12,5 L0,10 z"/></marker><marker id="composition" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path class="diamond" d="M0,5 L8,0 L16,5 L8,10 z"/></marker><marker id="subsetting" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path class="hollow" d="M0,0 L12,5 L0,10 z"/></marker><marker id="redefinition" viewBox="0 0 16 10" refX="16" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path class="hollow" d="M4,0 L16,5 L4,10 z"/><path class="tip" d="M2,0 L2,10"/></marker><marker id="reference" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path class="hollow" d="M0,5 L8,0 L16,5 L8,10 z"/></marker><marker id="transition" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path class="tip" d="M0,0 L10,4 L0,8"/></marker><marker id="flow" viewBox="0 0 10 9" refX="10" refY="4.5" markerWidth="10" markerHeight="9" orient="auto"><path class="diamond" d="M0,0 L10,4.5 L0,9 z"/></marker><marker id="message" viewBox="0 0 10 9" refX="10" refY="4.5" markerWidth="10" markerHeight="9" orient="auto"><path class="tip" d="M0,0 L10,4.5 L0,9 L2.5,4.5 z"/></marker><marker id="portion" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" orient="auto"><circle class="diamond" cx="5" cy="5" r="4"/></marker></defs>
<g>
<rect class="box" x="450.6" y="305.0" width="858.6" height="240.0" rx="10"/>
<text class="keyword" x="880.0" y="327.8" text-anchor="middle">«part»</text>
<text class="name" x="880.0" y="344.8" text-anchor="middle">defaultFlow : Flow</text>
<line class="rule" x1="450.6" y1="354.0" x2="1309.3" y2="354.0"/>
<text class="compartment" x="460.6" y="371.8">doc</text>
<text class="feature" x="470.6" y="388.8">Owns the stages and checkpoints of an overall</text>
<text class="feature" x="470.6" y="405.8">workflow. Specialize this definition to supply</text>
<text class="feature" x="470.6" y="422.8">different workflows.</text>
<line class="rule" x1="450.6" y1="432.0" x2="1309.3" y2="432.0"/>
<text class="compartment" x="460.6" y="449.8">items</text>
<text class="feature" x="470.6" y="466.8">item checkers : Checker[0..*]</text>
</g>
<g>
<rect class="box" x="460.6" y="481.0" width="178.4" height="54.0" rx="10"/>
<text class="keyword" x="549.8" y="503.8" text-anchor="middle">«part»</text>
<text class="name" x="549.8" y="520.8" text-anchor="middle">stages : Stage[1..*]</text>
</g>
<g>
<rect class="box" x="649.0" y="481.0" width="257.6" height="54.0" rx="10"/>
<text class="keyword" x="777.8" y="503.8" text-anchor="middle">«part»</text>
<text class="name" x="777.8" y="520.8" text-anchor="middle">checkpoints : Checkpoint[1..*]</text>
</g>
<g>
<rect class="box" x="916.6" y="481.0" width="178.4" height="54.0" rx="10"/>
<text class="keyword" x="1005.8" y="503.8" text-anchor="middle">«part»</text>
<text class="name" x="1005.8" y="520.8" text-anchor="middle">initialStage : Stage</text>
</g>
<g>
<rect class="box" x="1105.0" y="481.0" width="194.2" height="54.0" rx="10"/>
<text class="keyword" x="1202.2" y="503.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="1202.2" y="520.8" text-anchor="middle">stagesUseOwnedElements</text>
</g>
<g>
<rect class="box" x="28.0" y="633.0" width="529.4" height="396.0" rx="10"/>
<text class="keyword" x="292.7" y="655.8" text-anchor="middle">«part»</text>
<text class="name" x="292.7" y="672.8" text-anchor="middle">traces : Trace[0..*]</text>
<line class="rule" x1="28.0" y1="682.0" x2="557.4" y2="682.0"/>
<text class="compartment" x="38.0" y="699.8">doc</text>
<text class="feature" x="48.0" y="716.8">Tracks one wish through its root workflow and nested</text>
<text class="feature" x="48.0" y="733.8">executions. References an independent SysML</text>
<text class="feature" x="48.0" y="750.8">traceability model linking the wish to project</text>
<text class="feature" x="48.0" y="767.8">requirements, designs, implementations and</text>
<text class="feature" x="48.0" y="784.8">verification results. Only completion of the root</text>
<text class="feature" x="48.0" y="801.8">execution delivers the wish.</text>
<line class="rule" x1="28.0" y1="811.0" x2="557.4" y2="811.0"/>
<text class="compartment" x="38.0" y="828.8">items</text>
<text class="feature" x="48.0" y="845.8">item wish : Wish</text>
<line class="rule" x1="28.0" y1="855.0" x2="557.4" y2="855.0"/>
<text class="compartment" x="38.0" y="872.8">attributes</text>
<text class="feature" x="48.0" y="889.8">attribute status : WishStatus := WishStatus::received</text>
<text class="feature" x="48.0" y="906.8">attribute traceabilityModelUri : String</text>
<line class="rule" x1="28.0" y1="916.0" x2="557.4" y2="916.0"/>
<text class="compartment" x="38.0" y="933.8">occurrences</text>
<text class="feature" x="48.0" y="950.8">event occurrence delivered</text>
</g>
<g>
<rect class="box" x="38.0" y="965.0" width="218.0" height="54.0" rx="10"/>
<text class="keyword" x="147.0" y="987.8" text-anchor="middle">«part»</text>
<text class="name" x="147.0" y="1004.8" text-anchor="middle">execution : FlowExecution</text>
</g>
<g>
<rect class="box" x="266.0" y="965.0" width="281.4" height="54.0" rx="10"/>
<text class="keyword" x="406.7" y="987.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="406.7" y="1004.8" text-anchor="middle">deliveredWishHasCompletedRootFlow</text>
</g>
<g>
<rect class="box" x="28.0" y="305.0" width="402.6" height="308.0" rx="10"/>
<text class="keyword" x="229.3" y="327.8" text-anchor="middle">«perform action»</text>
<text class="name" x="229.3" y="344.8" text-anchor="middle">receiveWish</text>
<line class="rule" x1="28.0" y1="354.0" x2="430.6" y2="354.0"/>
<text class="compartment" x="38.0" y="371.8">doc</text>
<text class="feature" x="48.0" y="388.8">Register the wish and a separate trace with an</text>
<text class="feature" x="48.0" y="405.8">independent model reference. Assign selectedFlow</text>
<text class="feature" x="48.0" y="422.8">to the trace&apos;s root execution, create pending</text>
<text class="feature" x="48.0" y="439.8">records for its stages, enter its initialStage,</text>
<text class="feature" x="48.0" y="456.8">activate the trace and execution, and record</text>
<text class="feature" x="48.0" y="473.8">intake and selection. The directed features are…</text>
<line class="rule" x1="28.0" y1="483.0" x2="430.6" y2="483.0"/>
<text class="compartment" x="38.0" y="500.8">directed features</text>
<text class="feature" x="48.0" y="517.8">in attribute description : String</text>
<text class="feature" x="48.0" y="534.8">out item registeredWish : Wish</text>
</g>
<g>
<rect class="box" x="38.0" y="549.0" width="170.5" height="54.0" rx="10"/>
<text class="keyword" x="123.2" y="571.8" text-anchor="middle">«part»</text>
<text class="name" x="123.2" y="588.8" text-anchor="middle">selectedFlow : Flow</text>
</g>
<g>
<rect class="box" x="218.5" y="549.0" width="202.2" height="54.0" rx="10"/>
<text class="keyword" x="319.6" y="571.8" text-anchor="middle">«part»</text>
<text class="name" x="319.6" y="588.8" text-anchor="middle">registeredTrace : Trace</text>
</g>
<g>
<rect class="box" x="740.3" y="28.0" width="368.4" height="257.0" rx="10"/>
<text class="keyword" x="924.5" y="50.8" text-anchor="middle">«perform action»</text>
<text class="name" x="924.5" y="67.8" text-anchor="middle">recordActivity</text>
<line class="rule" x1="740.3" y1="77.0" x2="1108.7" y2="77.0"/>
<text class="compartment" x="750.3" y="94.8">doc</text>
<text class="feature" x="760.3" y="111.8">Follow the trace&apos;s active execution path to the</text>
<text class="feature" x="760.3" y="128.8">deepest current visit and append the activity</text>
<text class="feature" x="760.3" y="145.8">there. If its artifacts change, increment that</text>
<text class="feature" x="760.3" y="162.8">visit&apos;s revision before further assessment.</text>
<line class="rule" x1="740.3" y1="172.0" x2="1108.7" y2="172.0"/>
<text class="compartment" x="750.3" y="189.8">directed features</text>
<text class="feature" x="760.3" y="206.8">in item activity : ActivityRecord</text>
</g>
<g>
<rect class="box" x="863.0" y="221.0" width="123.0" height="54.0" rx="10"/>
<text class="keyword" x="924.5" y="243.8" text-anchor="middle">«part»</text>
<text class="name" x="924.5" y="260.8" text-anchor="middle">trace : Trace</text>
</g>
<g>
<rect class="box" x="28.0" y="28.0" width="692.3" height="118.0" rx="10"/>
<text class="keyword" x="374.2" y="50.8" text-anchor="middle">«perform action»</text>
<text class="name" x="374.2" y="67.8" text-anchor="middle">progressWish</text>
</g>
<path class="succession" fill="none" d="M 365.2 109.0 L 375.2 109.0" marker-end="url(#transition)"/>
<g>
<rect class="box" x="38.0" y="82.0" width="123.0" height="54.0" rx="10"/>
<text class="keyword" x="99.5" y="104.8" text-anchor="middle">«part»</text>
<text class="name" x="99.5" y="121.8" text-anchor="middle">trace : Trace</text>
</g>
<g>
<rect class="box" x="171.0" y="82.0" width="194.2" height="54.0" rx="10"/>
<text class="keyword" x="268.1" y="104.8" text-anchor="middle">«action»</text>
<text class="name" x="268.1" y="121.8" text-anchor="middle">selectCurrentExecution</text>
</g>
<g>
<rect class="box" x="375.2" y="82.0" width="170.5" height="54.0" rx="10"/>
<text class="keyword" x="460.4" y="104.8" text-anchor="middle">«action»</text>
<text class="name" x="460.4" y="121.8" text-anchor="middle">evaluateCheckpoints</text>
</g>
<g>
<rect class="box" x="555.7" y="82.0" width="154.6" height="54.0" rx="10"/>
<text class="keyword" x="633.0" y="104.8" text-anchor="middle">«action»</text>
<text class="name" x="633.0" y="121.8" text-anchor="middle">updateTraceStatus</text>
</g>
</svg>
