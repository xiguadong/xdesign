<text class="name" x="779.5" y="936.8" text-anchor="middle">stagesUseOwnedElements</text>
</g>
<g>
<rect class="box" x="662.8" y="305.0" width="529.4" height="396.0" rx="10"/>
<text class="keyword" x="927.5" y="327.8" text-anchor="middle">«part»</text>
<text class="name" x="927.5" y="344.8" text-anchor="middle">traces : Trace[0..*]</text>
<line class="rule" x1="662.8" y1="354.0" x2="1192.2" y2="354.0"/>
<text class="compartment" x="672.8" y="371.8">doc</text>
<text class="feature" x="682.8" y="388.8">Tracks one wish through its root workflow and nested</text>
<text class="feature" x="682.8" y="405.8">executions. References an independent SysML</text>
<text class="feature" x="682.8" y="422.8">traceability model linking the wish to project</text>
<text class="feature" x="682.8" y="439.8">requirements, designs, implementations and</text>
<text class="feature" x="682.8" y="456.8">verification results. Only completion of the root</text>
<text class="feature" x="682.8" y="473.8">execution delivers the wish.</text>
<line class="rule" x1="662.8" y1="483.0" x2="1192.2" y2="483.0"/>
<text class="compartment" x="672.8" y="500.8">items</text>
<text class="feature" x="682.8" y="517.8">item wish : Wish</text>
<line class="rule" x1="662.8" y1="527.0" x2="1192.2" y2="527.0"/>
<text class="compartment" x="672.8" y="544.8">attributes</text>
<text class="feature" x="682.8" y="561.8">attribute status : WishStatus := WishStatus::received</text>
<text class="feature" x="682.8" y="578.8">attribute traceabilityModelUri : String</text>
<line class="rule" x1="662.8" y1="588.0" x2="1192.2" y2="588.0"/>
<text class="compartment" x="672.8" y="605.8">occurrences</text>
<text class="feature" x="682.8" y="622.8">event occurrence delivered</text>
</g>
<g>
<rect class="box" x="672.8" y="637.0" width="218.0" height="54.0" rx="10"/>
<text class="keyword" x="781.8" y="659.8" text-anchor="middle">«part»</text>
<text class="name" x="781.8" y="676.8" text-anchor="middle">execution : FlowExecution</text>
</g>
<g>
<rect class="box" x="900.8" y="637.0" width="281.4" height="54.0" rx="10"/>
<text class="keyword" x="1041.5" y="659.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="1041.5" y="676.8" text-anchor="middle">deliveredWishHasCompletedRootFlow</text>
</g>
<g>
<rect class="box" x="28.0" y="305.0" width="614.8" height="308.0" rx="10"/>
<text class="keyword" x="335.4" y="327.8" text-anchor="middle">«perform action»</text>
<text class="name" x="335.4" y="344.8" text-anchor="middle">receiveWish</text>
<line class="rule" x1="28.0" y1="354.0" x2="642.8" y2="354.0"/>
<text class="compartment" x="38.0" y="371.8">doc</text>
<text class="feature" x="48.0" y="388.8">Register the wish and a separate trace with an</text>
<text class="feature" x="48.0" y="405.8">independent model reference. Assign selectedFlow</text>
<text class="feature" x="48.0" y="422.8">to the trace&apos;s root execution, create pending</text>
<text class="feature" x="48.0" y="439.8">records for its stages, enter its initialStage,</text>
<text class="feature" x="48.0" y="456.8">activate the trace and execution, and record</text>
<text class="feature" x="48.0" y="473.8">intake and selection. The directed features are…</text>
<line class="rule" x1="28.0" y1="483.0" x2="642.8" y2="483.0"/>
<text class="compartment" x="38.0" y="500.8">directed features</text>
<text class="feature" x="48.0" y="517.8">in attribute description : String</text>
<text class="feature" x="48.0" y="534.8">out item registeredWish : Wish</text>
</g>
<g>
<rect class="box" x="38.0" y="549.0" width="170.5" height="54.0" rx="10"/>
<text class="keyword" x="123.2" y="571.8" text-anchor="middle">«part»</text>
<text class="name" x="123.2" y="588.8" text-anchor="middle">selectedFlow : Flow</text>
</g>
<g>
<rect class="box" x="218.5" y="549.0" width="202.2" height="54.0" rx="10"/>
<text class="keyword" x="319.6" y="571.8" text-anchor="middle">«part»</text>
<text class="name" x="319.6" y="588.8" text-anchor="middle">registeredTrace : Trace</text>
</g>
<g>
<rect class="box" x="430.6" y="549.0" width="202.2" height="54.0" rx="10"/>
<text class="keyword" x="531.7" y="571.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="531.7" y="588.8" text-anchor="middle">selectedFlowIsAvailable</text>
</g>
<g>
<rect class="box" x="740.3" y="28.0" width="368.4" height="257.0" rx="10"/>
<text class="keyword" x="924.5" y="50.8" text-anchor="middle">«perform action»</text>
<text class="name" x="924.5" y="67.8" text-anchor="middle">recordActivity</text>
<line class="rule" x1="740.3" y1="77.0" x2="1108.7" y2="77.0"/>
<text class="compartment" x="750.3" y="94.8">doc</text>
<text class="feature" x="760.3" y="111.8">Follow the trace&apos;s active execution path to the</text>
<text class="feature" x="760.3" y="128.8">deepest current visit and append the activity</text>
<text class="feature" x="760.3" y="145.8">there. If its artifacts change, increment that</text>
<text class="feature" x="760.3" y="162.8">visit&apos;s revision before further assessment.</text>
<line class="rule" x1="740.3" y1="172.0" x2="1108.7" y2="172.0"/>
<text class="compartment" x="750.3" y="189.8">directed features</text>
<text class="feature" x="760.3" y="206.8">in item activity : ActivityRecord</text>
</g>
