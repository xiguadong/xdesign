<text x="72" y="80" class="subtitle">Default VModel definition · solid arrows: progression after a passed exit gate · dashed arrows: verifies stage</text>
<text x="72" y="125" class="lane">DEFINITION AND BUILD ↓</text>
<text x="838" y="125" class="lane">VERIFICATION AND DELIVERY ↑</text>
<path class="flow" d="M 257 259 L 257 299"><title>XDesignArchitecture::VModel::wishIntake → XDesignArchitecture::VModel::stakeholderNeeds</title></path>
<path class="flow" d="M 257 416 L 257 456"><title>XDesignArchitecture::VModel::stakeholderNeeds → XDesignArchitecture::VModel::systemRequirements</title></path>
<path class="flow" d="M 257 573 L 257 613"><title>XDesignArchitecture::VModel::systemRequirements → XDesignArchitecture::VModel::systemArchitecture</title></path>
