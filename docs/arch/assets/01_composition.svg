<svg xmlns="http://www.w3.org/2000/svg" width="1674" height="933" viewBox="0 0 1674 933" font-family="Arial, Helvetica, sans-serif" font-size="12">
<style>
.box { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.rule, .edge { stroke: #000000; stroke-width: 1; fill: none; }
.arrow { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.diamond { fill: #000000; stroke: #000000; stroke-width: 1; }
.hollow { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.tip { fill: none; stroke: #000000; stroke-width: 1; }
.initial { fill: #000000; }
.port { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.guide { stroke: #000000; stroke-width: 1; opacity: 0.4; }
.dependency { stroke: #000000; stroke-width: 1; fill: none; stroke-dasharray: 6 4; }
.succession { stroke: #000000; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
.lifeline { stroke: #000000; stroke-width: 1; fill: none; stroke-dasharray: 3 4; }
.lane { fill: none; stroke: #000000; stroke-width: 1; }
.name { fill: #000000; font-weight: bold; }
.abstract { font-style: italic; }
.keyword, .feature { fill: #000000; }
.aside { fill: #000000; paint-order: stroke; stroke: #ffffff; stroke-width: 3; stroke-linejoin: round; }
.compartment { fill: #000000; font-style: italic; }
@media (prefers-color-scheme: dark) {
.box, .arrow, .hollow, .port { fill: #1e1e1e; stroke: #d4d4d4; }
.rule, .edge, .tip, .guide, .dependency, .succession, .lifeline, .lane { stroke: #d4d4d4; }
.diamond { fill: #d4d4d4; stroke: #d4d4d4; }
.initial, .name, .keyword, .feature, .compartment { fill: #d4d4d4; }
.aside { fill: #d4d4d4; stroke: #1e1e1e; }
}
</style>
<defs><marker id="specialization" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path class="arrow" d="M0,0 L12,5 L0,10 z"/></marker><marker id="composition" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path class="diamond" d="M0,5 L8,0 L16,5 L8,10 z"/></marker><marker id="subsetting" viewBox="0 0 12 10" refX="12" refY="5" markerWidth="12" markerHeight="10" orient="auto"><path class="hollow" d="M0,0 L12,5 L0,10 z"/></marker><marker id="redefinition" viewBox="0 0 16 10" refX="16" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path class="hollow" d="M4,0 L16,5 L4,10 z"/><path class="tip" d="M2,0 L2,10"/></marker><marker id="reference" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path class="hollow" d="M0,5 L8,0 L16,5 L8,10 z"/></marker><marker id="transition" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" orient="auto"><path class="tip" d="M0,0 L10,4 L0,8"/></marker><marker id="flow" viewBox="0 0 10 9" refX="10" refY="4.5" markerWidth="10" markerHeight="9" orient="auto"><path class="diamond" d="M0,0 L10,4.5 L0,9 z"/></marker><marker id="message" viewBox="0 0 10 9" refX="10" refY="4.5" markerWidth="10" markerHeight="9" orient="auto"><path class="tip" d="M0,0 L10,4.5 L0,9 L2.5,4.5 z"/></marker><marker id="portion" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" orient="auto"><circle class="diamond" cx="5" cy="5" r="4"/></marker></defs>
<path class="edge" fill="none" d="M 655.7 380.0 L 655.7 509.0"/>
<path class="edge" fill="none" d="M 924.6 380.0 L 924.6 390.0 L 1381.7 390.0 L 1381.7 509.0"/>
<text class="aside" x="667.6" y="444.5" text-anchor="middle" dominant-baseline="middle">=</text>
<text class="aside" x="1153.1" y="401.9" text-anchor="middle" dominant-baseline="middle">=</text>
<g>
<rect class="box" x="226.4" y="509.0" width="858.6" height="240.0" rx="10"/>
<text class="keyword" x="655.7" y="531.8" text-anchor="middle">«part»</text>
<text class="name" x="655.7" y="548.8" text-anchor="middle">flow : Flow</text>
<line class="rule" x1="226.4" y1="558.0" x2="1085.0" y2="558.0"/>
<text class="compartment" x="236.4" y="575.8">doc</text>
<text class="feature" x="246.4" y="592.8">Owns the stages and checkpoints of an overall</text>
<text class="feature" x="246.4" y="609.8">workflow. Specialize this definition to supply</text>
<text class="feature" x="246.4" y="626.8">different workflows.</text>
<line class="rule" x1="226.4" y1="636.0" x2="1085.0" y2="636.0"/>
<text class="compartment" x="236.4" y="653.8">items</text>
<text class="feature" x="246.4" y="670.8">item checkers : Checker[0..*]</text>
</g>
<g>
<rect class="box" x="236.4" y="685.0" width="178.4" height="54.0" rx="10"/>
<text class="keyword" x="325.6" y="707.8" text-anchor="middle">«part»</text>
<text class="name" x="325.6" y="724.8" text-anchor="middle">stages : Stage[1..*]</text>
</g>
<g>
<rect class="box" x="424.8" y="685.0" width="257.6" height="54.0" rx="10"/>
<text class="keyword" x="553.6" y="707.8" text-anchor="middle">«part»</text>
<text class="name" x="553.6" y="724.8" text-anchor="middle">checkpoints : Checkpoint[1..*]</text>
</g>
<g>
<rect class="box" x="692.4" y="685.0" width="178.4" height="54.0" rx="10"/>
<text class="keyword" x="781.6" y="707.8" text-anchor="middle">«part»</text>
<text class="name" x="781.6" y="724.8" text-anchor="middle">initialStage : Stage</text>
</g>
<g>
<rect class="box" x="880.8" y="685.0" width="194.2" height="54.0" rx="10"/>
<text class="keyword" x="977.9" y="707.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="977.9" y="724.8" text-anchor="middle">stagesUseOwnedElements</text>
</g>
<g>
<rect class="box" x="386.9" y="28.0" width="806.6" height="352.0" rx="10"/>
<text class="keyword" x="790.1" y="50.8" text-anchor="middle">«part»</text>
<text class="name" x="790.1" y="67.8" text-anchor="middle">controller : Controller</text>
<line class="rule" x1="386.9" y1="77.0" x2="1193.4" y2="77.0"/>
<text class="compartment" x="396.9" y="94.8">doc</text>
<text class="feature" x="406.9" y="111.8">Registers wishes and traces, follows root and</text>
<text class="feature" x="406.9" y="128.8">nested workflows, evaluates checkpoints and</text>
<text class="feature" x="406.9" y="145.8">decides the next step. Incomplete subflows or</text>
<text class="feature" x="406.9" y="162.8">failed, missing or stale assessments prevent</text>
<text class="feature" x="406.9" y="179.8">stage completion.</text>
<line class="rule" x1="386.9" y1="189.0" x2="1193.4" y2="189.0"/>
<text class="compartment" x="396.9" y="206.8">items</text>
<text class="feature" x="406.9" y="223.8">item wishes : Wish[0..*]</text>
<line class="rule" x1="386.9" y1="233.0" x2="1193.4" y2="233.0"/>
<text class="compartment" x="396.9" y="250.8">occurrences</text>
<text class="feature" x="406.9" y="267.8">event occurrence entering</text>
<text class="feature" x="406.9" y="284.8">event occurrence assessing</text>
<text class="feature" x="406.9" y="301.8">event occurrence delivering</text>
</g>
<g>
<rect class="box" x="396.9" y="316.0" width="162.6" height="54.0" rx="10"/>
<text class="keyword" x="478.1" y="338.8" text-anchor="middle">«part»</text>
<text class="name" x="478.1" y="355.8" text-anchor="middle">defaultFlow : Flow</text>
</g>
<g>
<rect class="box" x="569.4" y="316.0" width="178.4" height="54.0" rx="10"/>
<text class="keyword" x="658.6" y="338.8" text-anchor="middle">«part»</text>
<text class="name" x="658.6" y="355.8" text-anchor="middle">traces : Trace[0..*]</text>
</g>
<g>
<rect class="box" x="757.8" y="316.0" width="135.2" height="54.0" rx="10"/>
<text class="keyword" x="825.4" y="338.8" text-anchor="middle">«perform action»</text>
<text class="name" x="825.4" y="355.8" text-anchor="middle">receiveWish</text>
</g>
<g>
<rect class="box" x="903.0" y="316.0" width="135.2" height="54.0" rx="10"/>
<text class="keyword" x="970.6" y="338.8" text-anchor="middle">«perform action»</text>
<text class="name" x="970.6" y="355.8" text-anchor="middle">recordActivity</text>
</g>
<g>
<rect class="box" x="1048.2" y="316.0" width="135.2" height="54.0" rx="10"/>
<text class="keyword" x="1115.8" y="338.8" text-anchor="middle">«perform action»</text>
<text class="name" x="1115.8" y="355.8" text-anchor="middle">progressWish</text>
</g>
<g>
<rect class="box" x="1117.0" y="509.0" width="529.4" height="396.0" rx="10"/>
<text class="keyword" x="1381.7" y="531.8" text-anchor="middle">«part»</text>
<text class="name" x="1381.7" y="548.8" text-anchor="middle">traces : Trace[0..*]</text>
<line class="rule" x1="1117.0" y1="558.0" x2="1646.4" y2="558.0"/>
<text class="compartment" x="1127.0" y="575.8">doc</text>
<text class="feature" x="1137.0" y="592.8">Tracks one wish through its root workflow and nested</text>
<text class="feature" x="1137.0" y="609.8">executions. References an independent SysML</text>
<text class="feature" x="1137.0" y="626.8">traceability model linking the wish to project</text>
<text class="feature" x="1137.0" y="643.8">requirements, designs, implementations and</text>
<text class="feature" x="1137.0" y="660.8">verification results. Only completion of the root</text>
<text class="feature" x="1137.0" y="677.8">execution delivers the wish.</text>
<line class="rule" x1="1117.0" y1="687.0" x2="1646.4" y2="687.0"/>
<text class="compartment" x="1127.0" y="704.8">items</text>
<text class="feature" x="1137.0" y="721.8">item wish : Wish</text>
<line class="rule" x1="1117.0" y1="731.0" x2="1646.4" y2="731.0"/>
<text class="compartment" x="1127.0" y="748.8">attributes</text>
<text class="feature" x="1137.0" y="765.8">attribute status : WishStatus := WishStatus::received</text>
<text class="feature" x="1137.0" y="782.8">attribute traceabilityModelUri : String</text>
<line class="rule" x1="1117.0" y1="792.0" x2="1646.4" y2="792.0"/>
<text class="compartment" x="1127.0" y="809.8">occurrences</text>
<text class="feature" x="1137.0" y="826.8">event occurrence delivered</text>
</g>
<g>
<rect class="box" x="1127.0" y="841.0" width="218.0" height="54.0" rx="10"/>
<text class="keyword" x="1236.0" y="863.8" text-anchor="middle">«part»</text>
<text class="name" x="1236.0" y="880.8" text-anchor="middle">execution : FlowExecution</text>
</g>
<g>
<rect class="box" x="1355.0" y="841.0" width="281.4" height="54.0" rx="10"/>
<text class="keyword" x="1495.7" y="863.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="1495.7" y="880.8" text-anchor="middle">deliveredWishHasCompletedRootFlow</text>
</g>
<g>
<rect class="box" x="28.0" y="28.0" width="178.4" height="54.0" rx="10"/>
<text class="keyword" x="117.2" y="50.8" text-anchor="middle">«assert constraint»</text>
<text class="name" x="117.2" y="67.8" text-anchor="middle">everyWishHasOneTrace</text>
</g>
<rect class="port" x="650.6" y="374.9" width="10.2" height="10.2" rx="0.0"/>
<text class="aside" x="667.6" y="387.6" text-anchor="start" dominant-baseline="middle">defaultFlow</text>
<rect class="port" x="919.5" y="374.9" width="10.2" height="10.2" rx="0.0"/>
<text class="aside" x="936.5" y="387.6" text-anchor="start" dominant-baseline="middle">traces</text>
</svg>
