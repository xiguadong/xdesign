<line class="rule" x1="28.0" y1="405.0" x2="557.4" y2="405.0"/>
<text class="compartment" x="38.0" y="422.8">doc</text>
<text class="feature" x="48.0" y="439.8">Tracks one wish through its root workflow and nested</text>
<text class="feature" x="48.0" y="456.8">executions. References an independent SysML</text>
<text class="feature" x="48.0" y="473.8">traceability model linking the wish to project</text>
<text class="feature" x="48.0" y="490.8">requirements, designs, implementations and</text>
<text class="feature" x="48.0" y="507.8">verification results. Only completion of the root</text>
<text class="feature" x="48.0" y="524.8">execution delivers the wish.</text>
<line class="rule" x1="28.0" y1="534.0" x2="557.4" y2="534.0"/>
<text class="compartment" x="38.0" y="551.8">items</text>
