<line class="rule" x1="28.0" y1="578.0" x2="557.4" y2="578.0"/>
<text class="compartment" x="38.0" y="595.8">attributes</text>
<text class="feature" x="48.0" y="612.8">attribute status : WishStatus := WishStatus::received</text>
<text class="feature" x="48.0" y="629.8">attribute traceabilityModelUri : String</text>
<line class="rule" x1="28.0" y1="639.0" x2="557.4" y2="639.0"/>
<text class="compartment" x="38.0" y="656.8">occurrences</text>
<text class="feature" x="48.0" y="673.8">event occurrence delivered</text>
</g>
