<line class="rule" x1="1128.7" y1="77.0" x2="1743.5" y2="77.0"/>
<text class="compartment" x="1138.7" y="94.8">doc</text>
<text class="feature" x="1148.7" y="111.8">Register the wish and a separate trace with an</text>
<text class="feature" x="1148.7" y="128.8">independent model reference. Assign selectedFlow</text>
<text class="feature" x="1148.7" y="145.8">to the trace&apos;s root execution, create pending</text>
<text class="feature" x="1148.7" y="162.8">records for its stages, enter its initialStage,</text>
<text class="feature" x="1148.7" y="179.8">activate the trace and execution, and record</text>
<text class="feature" x="1148.7" y="196.8">intake and selection. The directed features are…</text>
