<line class="rule" x1="28.0" y1="961.0" x2="1594.2" y2="961.0"/>
<text class="compartment" x="38.0" y="978.8">doc</text>
<text class="feature" x="48.0" y="995.8">Local POSIX operational store with a versioned</text>
<text class="feature" x="48.0" y="1012.8">root, SQLite record authority, content-addressed</text>
<text class="feature" x="48.0" y="1029.8">immutable blobs, and operation receipts. The</text>
<text class="feature" x="48.0" y="1046.8">default root is .xdesign with XDESIGN_STORE_ROOT</text>
<text class="feature" x="48.0" y="1063.8">as an override. Root and database identities,</text>
<text class="feature" x="48.0" y="1080.8">owner-only permissions and path safety are…</text>
<line class="rule" x1="28.0" y1="1090.0" x2="1594.2" y2="1090.0"/>
<text class="compartment" x="38.0" y="1107.8">attributes</text>
<text class="feature" x="48.0" y="1124.8">attribute rootUri : String = &quot;.xdesign&quot;</text>
<text class="feature" x="48.0" y="1141.8">attribute schemaVersion : Integer = 1</text>
<line class="rule" x1="28.0" y1="1151.0" x2="1594.2" y2="1151.0"/>
