<rect class="box" x="440.6" y="28.0" width="1081.2" height="386.0" rx="10"/>
<text class="keyword" x="981.2" y="50.8" text-anchor="middle">«part»</text>
<text class="name" x="981.2" y="67.8" text-anchor="middle">outcomeAccepted : Checkpoint</text>
<line class="rule" x1="440.6" y1="77.0" x2="1521.8" y2="77.0"/>
<text class="compartment" x="450.6" y="94.8">attributes</text>
<text class="feature" x="460.6" y="111.8">attribute kind : CheckKind = CheckKind::semantic</text>
<text class="feature" x="460.6" y="128.8">attribute criteria : String[1..*] = &quot;The delivered artifacts let the requester see the outcome from them, without reading the model or re-asking.&quot;</text>
<text class="feature" x="460.6" y="145.8">attribute agentMayJudge : Boolean = true</text>
<text class="feature" x="460.6" y="162.8">attribute humanMayJudge : Boolean = true</text>
<line class="rule" x1="440.6" y1="172.0" x2="1521.8" y2="172.0"/>
<text class="compartment" x="450.6" y="189.8">doc</text>
<text class="feature" x="460.6" y="206.8">Reusable gate definition, independent of a particular wish. Criteria require evidence-backed checks or engineering judgments; assessments of these</text>
<text class="feature" x="460.6" y="223.8">criteria belong to the wish&apos;s stage record. kind separates criteria a fixed check can establish (syntactic) from criteria that need judgment</text>
<text class="feature" x="460.6" y="240.8">(semantic). A syntactic checkpoint names the checkers that fix its check, and the script judges it, so it sets no judge flag. A semantic</text>
<text class="feature" x="460.6" y="257.8">checkpoint names no checker, because no code can establish it, and states whether an agent or a human may judge it. Judgment permission is one</text>
<text class="feature" x="460.6" y="274.8">flag per authority rather than a list of authorities: the compiler&apos;s export keeps only the first element of a multi-valued value, and a script</text>
<text class="feature" x="460.6" y="291.8">reading that export must still see the whole permission.</text>
<line class="rule" x1="440.6" y1="301.0" x2="1521.8" y2="301.0"/>
<text class="compartment" x="450.6" y="318.8">items</text>
<text class="feature" x="460.6" y="335.8">item checkers : Checker[0..*]</text>
</g>
