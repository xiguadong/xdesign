<g id="ne0290fdabbbc38f0f121" class="node diagram-node shape-box" data-native-id="b677b6dc-c8ac-5c88-87e1-dcad50036d5a" data-shape="box">
<title>XDesignArchitecture::FlowExecution
b677b6dc-c8ac-5c88-87e1-dcad50036d5a
ref part assignedFlow : Flow
attribute status : FlowStatus
part stageRecords : StageRecord [1..*]
ref part currentRecord : StageRecord [0..1]
assertconstraint recordsEveryFlowStage
assertconstraint recordsUseAssignedFlow
assertconstraint completedFlowHasAuthorizedTerminalStage
FlowStatus::pending
assignedFlow.stages-&gt;forAll { in requiredStage : Stage;
                stageRecords-&gt;exists { in record : StageRecord;
                    record.stage == requiredStage
                }
            }
stageRecords-&gt;forAll { in record : StageRecord;
                assignedFlow.stages-&gt;includes(record.stage)
            }
status != FlowStatus::completed or
            currentRecord-&gt;exists { in record : StageRecord;
                record.stage.completesFlow and
                record.status == StageStatus::completed and
                record.completionAuthorized
            }
b677b6dc-c8ac-5c88-87e1-dcad50036d5a</title>
<rect fill="white" stroke="none" x="464.38" y="-717.0" width="171.0" height="132.0" class="node" /><polygon fill="#647a91" stroke="#647a91" points="464.38,-649.5 464.38,-649.5 635.38,-649.5 635.38,-649.5 464.38,-649.5" />
