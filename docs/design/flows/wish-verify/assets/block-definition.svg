<title>XDesignArchitecture::CheckpointAssessment
46378ea8-ab0b-5d58-ab13-1286e4886d4c
ref part checkpoint : Checkpoint
attribute evaluatedRevision
attribute outcome : CheckpointOutcome
attribute judgedBy : JudgeAuthority
attribute assessor
attribute rationale
attribute evidenceUris [0..*]
ref item activities : ActivityRecord [0..*]
assertconstraint passedAssessmentHasEvidence
assertconstraint judgmentMatchesCheckpointKind
CheckpointOutcome::unevaluated
outcome != CheckpointOutcome::passed or size(evidenceUris) &gt; 0
(checkpoint.kind != CheckKind::syntactic or judgedBy == JudgeAuthority::script) and
            (checkpoint.kind != CheckKind::semantic or judgedBy != JudgeAuthority::script)
