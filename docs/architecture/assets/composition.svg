<text class="compartment" x="664.4" y="835.8">doc</text>
<text class="feature" x="674.4" y="852.8">Local POSIX operational store with a versioned</text>
<text class="feature" x="674.4" y="869.8">root, SQLite record authority, content-addressed</text>
<text class="feature" x="674.4" y="886.8">immutable blobs, and operation receipts. The</text>
<text class="feature" x="674.4" y="903.8">default root is .xdesign with XDESIGN_STORE_ROOT</text>
<text class="feature" x="674.4" y="920.8">as an override. Root and database identities,</text>
<text class="feature" x="674.4" y="937.8">owner-only permissions and path safety are…</text>
