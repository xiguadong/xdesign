theme:
  name: material
  custom_dir: tools/docs_site/theme
  language: en
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 2-4

extra_css:
  - stylesheets/xdesign.css
extra_javascript:
  - javascripts/diagrams.js

hooks:
  - tools/docs_site/hooks.py

watch:
  - tools/docs_site

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
