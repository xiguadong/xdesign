site_name: xdesign
site_description: System models, wishes, and the evidence behind engineering delivery.
docs_dir: docs
site_dir: cache/docs-site/html
dev_addr: 127.0.0.1:8766
use_directory_urls: true

exclude_docs: |
  AGENTS.md

